name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit version
        shell: bash
        run: moon version --all
      - name: Enforce minimum MoonBit compiler version
        shell: bash
        run: |
          required_version="0.10.14"
          compiler_version="$(moonc -v | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          if [[ -z "$compiler_version" ]] || [[ "$(printf '%s\n%s\n' "$required_version" "$compiler_version" | sort -V | head -n1)" != "$required_version" ]]; then
            echo "moonc >= $required_version is required; found '${compiler_version:-unknown}'"
            exit 1
          fi
          echo "moonc $compiler_version satisfies the minimum $required_version"
      - name: Verify MoonBit formatting
        run: moon fmt --check src main
      - name: Build MoonBit packages
        run: moon build
      - name: Check
        run: moon check
      - name: Test
        run: moon test
      - name: Run MoonBit acceptance demo
        run: moon run main

  smoke-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run core deterministic Python fixtures
        run: |
          python examples/python_data_agent.py
          python examples/python_repository_agent.py
          python examples/python_ticket_agent.py
          python examples/python_adapter.py
      - name: Run synthetic Responses trace fixture
        run: python examples/python_openai_responses_fixture.py

