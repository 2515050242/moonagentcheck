name: CI

on:
  push:
  pull_request:

env:
  MOONBIT_INSTALL_VERSION: "0.10.16+b1a0e846e"

jobs:
  moonbit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit version
        shell: bash
        run: moon version --all
      - name: Verify pinned MoonBit compiler version
        shell: bash
        run: |
          compiler_version="$(moonc -v | awk '{print $1}')"
          if [[ "$compiler_version" != "v$MOONBIT_INSTALL_VERSION" ]]; then
            echo "Expected moonc v$MOONBIT_INSTALL_VERSION; found '${compiler_version:-unknown}'"
            exit 1
          fi
          echo "Verified moonc $compiler_version"
      - name: Verify MoonBit formatting
        run: moon fmt --check src main
      - name: Build MoonBit packages
        run: moon build
      - name: Check
        run: moon check
      - name: Test
        run: moon test
      - name: Run MoonBit acceptance demo
        run: moon run main

  smoke-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit version
        shell: bash
        run: moon version --all
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run Python fixtures against the MoonBit evaluator
        run: |
          python examples/python_data_agent.py
          python examples/python_repository_agent.py
          python examples/python_ticket_agent.py
          python examples/python_adapter.py
      - name: Run synthetic Responses trace fixture
        run: python examples/python_openai_responses_fixture.py

  published-package-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit version
        run: moon version --all
      - name: Prepare isolated Mooncakes consumer
        shell: bash
        run: |
          cp -R examples/mooncakes-consumer "$RUNNER_TEMP/mooncakes-consumer"
      - name: Install and test the published package
        working-directory: ${{ runner.temp }}/mooncakes-consumer
        run: |
          moon update
          moon build
          moon test

