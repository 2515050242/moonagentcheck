<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">moonagentcheck event evaluation flow</title>
  <desc id="desc">A state-oriented flow showing calls, results, retries, writes and violations.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4d6bfe"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #51657d; }
      .node { font: 700 17px system-ui, sans-serif; fill: #172b4d; }
      .detail { font: 400 14px system-ui, sans-serif; fill: #334e68; }
      .label { font: 600 13px system-ui, sans-serif; fill: #627d98; }
      .event { fill: #ffffff; stroke: #7895ff; stroke-width: 2; rx: 16; }
      .ok { fill: #eafaf3; stroke: #55a887; stroke-width: 2; rx: 16; }
      .bad { fill: #fff0f0; stroke: #e36b6b; stroke-width: 2; rx: 16; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f7fbff"/>
  <text x="60" y="62" class="title">event evaluation flow</text>
  <text x="60" y="92" class="subtitle">Every violation is derived from an explicit event relationship.</text>

  <rect x="60" y="150" width="210" height="105" class="event"/>
  <text x="165" y="188" text-anchor="middle" class="node">call</text>
  <text x="165" y="216" text-anchor="middle" class="detail">call_id + operation_id</text>
  <text x="165" y="238" text-anchor="middle" class="detail">record attempt</text>

  <rect x="350" y="150" width="210" height="105" class="event"/>
  <text x="455" y="188" text-anchor="middle" class="node">result</text>
  <text x="455" y="216" text-anchor="middle" class="detail">same call_id?</text>
  <text x="455" y="238" text-anchor="middle" class="detail">resolve pending call</text>

  <rect x="640" y="150" width="210" height="105" class="ok"/>
  <text x="745" y="188" text-anchor="middle" class="node">completed</text>
  <text x="745" y="216" text-anchor="middle" class="detail">safe to continue</text>
  <text x="745" y="238" text-anchor="middle" class="detail">or inspect next event</text>

  <rect x="930" y="150" width="210" height="105" class="bad"/>
  <text x="1035" y="188" text-anchor="middle" class="node">orphan-result</text>
  <text x="1035" y="216" text-anchor="middle" class="detail">no matching call_id</text>
  <text x="1035" y="238" text-anchor="middle" class="detail">record event index</text>

  <line x1="270" y1="202" x2="345" y2="202" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="202" x2="635" y2="202" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="220" x2="925" y2="220" stroke="#e36b6b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="745" y="138" text-anchor="middle" class="label">matching call</text>
  <text x="745" y="280" text-anchor="middle" class="label">no matching call</text>

  <rect x="60" y="360" width="210" height="105" class="event"/>
  <text x="165" y="398" text-anchor="middle" class="node">retry call</text>
  <text x="165" y="426" text-anchor="middle" class="detail">same operation_id</text>
  <text x="165" y="448" text-anchor="middle" class="detail">increment attempts</text>

  <rect x="350" y="360" width="210" height="105" class="ok"/>
  <text x="455" y="398" text-anchor="middle" class="node">within limit</text>
  <text x="455" y="426" text-anchor="middle" class="detail">continue evaluating</text>
  <text x="455" y="448" text-anchor="middle" class="detail">deterministically</text>

  <rect x="640" y="360" width="210" height="105" class="bad"/>
  <text x="745" y="398" text-anchor="middle" class="node">retry-limit</text>
  <text x="745" y="426" text-anchor="middle" class="detail">attempts &gt; max_retries</text>
  <text x="745" y="448" text-anchor="middle" class="detail">record operation_id</text>

  <rect x="930" y="360" width="210" height="105" class="bad"/>
  <text x="1035" y="398" text-anchor="middle" class="node">side effect guard</text>
  <text x="1035" y="426" text-anchor="middle" class="detail">write needs a call</text>
  <text x="1035" y="448" text-anchor="middle" class="detail">duplicate needs detection</text>

  <line x1="270" y1="412" x2="345" y2="412" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="412" x2="635" y2="412" stroke="#4d6bfe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="430" x2="925" y2="430" stroke="#e36b6b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="455" y="348" text-anchor="middle" class="label">count ≤ limit</text>
  <text x="600" y="500" text-anchor="middle" class="label">count &gt; limit</text>

  <rect x="60" y="560" width="1080" height="66" rx="16" fill="#172b4d"/>
  <text x="600" y="588" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffffff">At end of stream: unresolved calls become missing-result violations.</text>
  <text x="600" y="610" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#c8d6e5">No network calls, model calls, or hidden timing assumptions are needed.</text>
</svg>
