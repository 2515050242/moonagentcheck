<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">moonagentcheck 仓库结构</title>
  <desc id="desc">展示源码、测试、示例、文档和持续集成文件的仓库结构图。</desc>
  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #51657d; }
      .folder { font: 700 18px system-ui, sans-serif; fill: #172b4d; }
      .file { font: 400 14px system-ui, sans-serif; fill: #334e68; }
      .note { font: 400 13px system-ui, sans-serif; fill: #627d98; }
      .card { stroke-width: 2; rx: 16; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fbfcfe"/>
  <text x="60" y="62" class="title">仓库结构图</text>
  <text x="60" y="92" class="subtitle">每个目录只承担一种可审查的职责。</text>

  <rect x="60" y="145" width="240" height="355" fill="#eef3ff" stroke="#7895ff" class="card"/>
  <text x="180" y="188" text-anchor="middle" class="folder">src/ 源码</text>
  <text x="95" y="235" class="file">model.mbt</text>
  <text x="95" y="263" class="note">Event / Violation 类型</text>
  <text x="95" y="310" class="file">contract.mbt</text>
  <text x="95" y="338" class="note">确定性评估器</text>
  <text x="95" y="385" class="file">contract_test.mbt</text>
  <text x="95" y="413" class="note">五个可执行场景</text>
  <text x="95" y="460" class="file">moon.pkg</text>
  <text x="95" y="488" class="note">包边界</text>

  <rect x="340" y="145" width="240" height="355" fill="#eafaf3" stroke="#55a887" class="card"/>
  <text x="460" y="188" text-anchor="middle" class="folder">examples/ 示例</text>
  <text x="375" y="235" class="file">python_data_agent.py</text>
  <text x="375" y="263" class="note">框架无关的 fixture</text>
  <text x="375" y="310" class="file">离线事件</text>
  <text x="375" y="338" class="note">不调用模型或网络</text>
  <text x="375" y="385" class="file">JSON 输出</text>
  <text x="375" y="413" class="note">终端中即可直接查看</text>

  <rect x="620" y="145" width="240" height="355" fill="#fff8ed" stroke="#e6a33a" class="card"/>
  <text x="740" y="188" text-anchor="middle" class="folder">docs/ 文档</text>
  <text x="655" y="235" class="file">architecture.svg</text>
  <text x="655" y="263" class="note">系统边界</text>
  <text x="655" y="310" class="file">evaluation-flow.svg</text>
  <text x="655" y="338" class="note">状态与违规流程</text>
  <text x="655" y="385" class="file">behavior-contract.md</text>
  <text x="655" y="413" class="note">规则和明确不做的内容</text>
  <text x="655" y="460" class="file">decisions/</text>
  <text x="655" y="488" class="note">范围决策</text>

  <rect x="900" y="145" width="240" height="355" fill="#fff0f0" stroke="#e36b6b" class="card"/>
  <text x="1020" y="188" text-anchor="middle" class="folder">项目根目录</text>
  <text x="935" y="235" class="file">moon.mod</text>
  <text x="935" y="263" class="note">已发布模块元数据</text>
  <text x="935" y="310" class="file">README.md</text>
  <text x="935" y="338" class="note">安装与验证说明</text>
  <text x="935" y="385" class="file">.github/workflows/ci.yml</text>
  <text x="935" y="413" class="note">每次变更都执行检查与测试</text>
  <text x="935" y="460" class="file">LICENSE</text>
  <text x="935" y="488" class="note">Apache-2.0 开源许可</text>

  <path d="M300 315 H335 M580 315 H615 M860 315 H895" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="600" y="555" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#52606d">这种布局把源码、证据、文档和发布元数据分开，便于审核。</text>
</svg>
