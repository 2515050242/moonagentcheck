<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">moonagentcheck architecture</title>
  <desc id="desc">An adapter-neutral architecture from agent applications to deterministic contract reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#19324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4d6bfe"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #51657d; }
      .head { font: 700 19px system-ui, sans-serif; fill: #172b4d; }
      .body { font: 400 15px system-ui, sans-serif; fill: #334e68; }
      .small { font: 400 13px system-ui, sans-serif; fill: #627d98; }
      .box { stroke-width: 2; rx: 18; filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="60" y="64" class="title">moonagentcheck architecture</text>
  <text x="60" y="94" class="subtitle">An adapter-neutral, deterministic behavior contract layer for Agent applications</text>

  <rect x="60" y="150" width="250" height="310" fill="#ffffff" stroke="#9bb7d4" class="box"/>
  <text x="185" y="195" text-anchor="middle" class="head">Agent applications</text>
  <text x="185" y="235" text-anchor="middle" class="body">MoonBit Agent SDK</text>
  <text x="185" y="272" text-anchor="middle" class="body">Python application</text>
  <text x="185" y="309" text-anchor="middle" class="body">MCP / workflow client</text>
  <line x1="105" y1="350" x2="265" y2="350" stroke="#d9e2ec"/>
  <text x="185" y="390" text-anchor="middle" class="small">The runtime remains owned</text>
  <text x="185" y="412" text-anchor="middle" class="small">by the application.</text>

  <rect x="380" y="150" width="250" height="310" fill="#f0f5ff" stroke="#7895ff" class="box"/>
  <text x="505" y="195" text-anchor="middle" class="head">Event adapter</text>
  <text x="505" y="235" text-anchor="middle" class="body">Event::new(...)</text>
  <text x="505" y="272" text-anchor="middle" class="body">call / result</text>
  <text x="505" y="309" text-anchor="middle" class="body">operation_id</text>
  <line x1="425" y1="350" x2="585" y2="350" stroke="#b6c6ff"/>
  <text x="505" y="390" text-anchor="middle" class="small">Normalize framework-specific</text>
  <text x="505" y="412" text-anchor="middle" class="small">records into a small event model.</text>

  <rect x="700" y="150" width="250" height="310" fill="#fff8ed" stroke="#e6a33a" class="box"/>
  <text x="825" y="195" text-anchor="middle" class="head">Contract evaluator</text>
  <text x="825" y="235" text-anchor="middle" class="body">evaluate(events, limit)</text>
  <text x="825" y="272" text-anchor="middle" class="body">deterministic state scan</text>
  <text x="825" y="309" text-anchor="middle" class="body">O(n) event evaluation</text>
  <line x1="745" y1="350" x2="905" y2="350" stroke="#f3c778"/>
  <text x="825" y="390" text-anchor="middle" class="small">No model, network, or real</text>
  <text x="825" y="412" text-anchor="middle" class="small">tool is contacted.</text>

  <rect x="1020" y="150" width="120" height="310" fill="#eafaf3" stroke="#55a887" class="box"/>
  <text x="1080" y="195" text-anchor="middle" class="head">Report</text>
  <text x="1080" y="245" text-anchor="middle" class="body">Violation</text>
  <text x="1080" y="282" text-anchor="middle" class="body">rule</text>
  <text x="1080" y="319" text-anchor="middle" class="body">index</text>
  <text x="1080" y="356" text-anchor="middle" class="body">message</text>
  <text x="1080" y="405" text-anchor="middle" class="small">CI /</text>
  <text x="1080" y="425" text-anchor="middle" class="small">developer</text>

  <line x1="310" y1="305" x2="375" y2="305" stroke="#4d6bfe" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="630" y1="305" x2="695" y2="305" stroke="#4d6bfe" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="950" y1="305" x2="1015" y2="305" stroke="#4d6bfe" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="342" y="286" text-anchor="middle" class="small">records</text>
  <text x="662" y="286" text-anchor="middle" class="small">events</text>
  <text x="982" y="286" text-anchor="middle" class="small">violations</text>

  <rect x="60" y="520" width="1080" height="48" rx="14" fill="#172b4d"/>
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff">The project checks behavior at the event boundary; it does not replace the Agent runtime.</text>
</svg>
