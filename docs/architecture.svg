<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">moonagentcheck 系统架构</title>
  <desc id="desc">从 Agent 应用到确定性行为契约报告的适配器无关架构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#19324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4d6bfe"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #51657d; }
      .head { font: 700 19px system-ui, sans-serif; fill: #172b4d; }
      .body { font: 400 15px system-ui, sans-serif; fill: #334e68; }
      .small { font: 400 13px system-ui, sans-serif; fill: #627d98; }
      .box { stroke-width: 2; rx: 18; filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="60" y="64" class="title">moonagentcheck 系统架构</text>
  <text x="60" y="94" class="subtitle">面向 Agent 应用的适配器无关、确定性行为契约层</text>

  <rect x="60" y="150" width="250" height="310" fill="#ffffff" stroke="#9bb7d4" class="box"/>
  <text x="185" y="195" text-anchor="middle" class="head">Agent 应用</text>
  <text x="185" y="235" text-anchor="middle" class="body">MoonBit Agent SDK</text>
  <text x="185" y="272" text-anchor="middle" class="body">Python 应用</text>
  <text x="185" y="309" text-anchor="middle" class="body">MCP / workflow 客户端</text>
  <line x1="105" y1="350" x2="265" y2="350" stroke="#d9e2ec"/>
  <text x="185" y="390" text-anchor="middle" class="small">运行时仍由应用自己负责</text>
  <text x="185" y="412" text-anchor="middle" class="small">检查器不接管 Agent。</text>

  <rect x="380" y="150" width="250" height="310" fill="#f0f5ff" stroke="#7895ff" class="box"/>
  <text x="505" y="195" text-anchor="middle" class="head">事件适配器</text>
  <text x="505" y="235" text-anchor="middle" class="body">Event::new(...)</text>
  <text x="505" y="272" text-anchor="middle" class="body">call / result</text>
  <text x="505" y="309" text-anchor="middle" class="body">operation_id</text>
  <line x1="425" y1="350" x2="585" y2="350" stroke="#b6c6ff"/>
  <text x="505" y="390" text-anchor="middle" class="small">把不同框架的记录统一转换为</text>
  <text x="505" y="412" text-anchor="middle" class="small">简洁的事件模型。</text>

  <rect x="700" y="150" width="250" height="310" fill="#fff8ed" stroke="#e6a33a" class="box"/>
  <text x="825" y="195" text-anchor="middle" class="head">行为契约评估器</text>
  <text x="825" y="235" text-anchor="middle" class="body">evaluate(events, limit)</text>
  <text x="825" y="272" text-anchor="middle" class="body">确定性状态扫描</text>
  <text x="825" y="309" text-anchor="middle" class="body">O(n) 事件评估</text>
  <line x1="745" y1="350" x2="905" y2="350" stroke="#f3c778"/>
  <text x="825" y="390" text-anchor="middle" class="small">不调用模型、网络或</text>
  <text x="825" y="412" text-anchor="middle" class="small">真实工具。</text>

  <rect x="1020" y="150" width="120" height="310" fill="#eafaf3" stroke="#55a887" class="box"/>
  <text x="1080" y="195" text-anchor="middle" class="head">评估报告</text>
  <text x="1080" y="245" text-anchor="middle" class="body">违规记录</text>
  <text x="1080" y="282" text-anchor="middle" class="body">规则</text>
  <text x="1080" y="319" text-anchor="middle" class="body">索引</text>
  <text x="1080" y="356" text-anchor="middle" class="body">说明</text>
  <text x="1080" y="405" text-anchor="middle" class="small">CI /</text>
  <text x="1080" y="425" text-anchor="middle" class="small">开发者</text>

  <line x1="310" y1="305" x2="375" y2="305" stroke="#4d6bfe" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="630" y1="305" x2="695" y2="305" stroke="#4d6bfe" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="950" y1="305" x2="1015" y2="305" stroke="#4d6bfe" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="342" y="286" text-anchor="middle" class="small">记录</text>
  <text x="662" y="286" text-anchor="middle" class="small">事件</text>
  <text x="982" y="286" text-anchor="middle" class="small">违规</text>

  <rect x="60" y="520" width="1080" height="48" rx="14" fill="#172b4d"/>
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff">项目在事件边界检查行为，不替代 Agent 运行时。</text>
</svg>
